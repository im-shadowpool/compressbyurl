name: MCP CI

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-ci.yml"
      - "docs/mcp/**"
      - "packages/mcp/**"
      - "packages/url-audit-core/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mcp-ci.yml"
      - "docs/mcp/**"
      - "packages/mcp/**"
      - "packages/url-audit-core/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22.19.0
          - 24
          - 26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run security:audit:prod
      - run: npm run audit-core:test
      - run: npm run mcp:verify
      - run: npm run smoke:packed --workspace compressbyurl-mcp
      - run: npm pack --dry-run --workspace compressbyurl-mcp

name: Publish MCP package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm with trusted-publishing support
        run: npm install --global npm@11.19.1
      - run: node packages/mcp/scripts/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - run: npm run mcp:release-check
      - run: npm publish --workspace compressbyurl-mcp
